[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen25-qlora-rag"
version = "2.0.0"
description = "Resource-Constrained QLoRA Fine-Tuning & Confidence-Gated Hybrid RAG on Qwen2.5-3B-Instruct (6 GB VRAM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Omer" }]
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.43.3",
    "peft>=0.11.1",
    "bitsandbytes>=0.43.3",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "trl>=0.9.6",
    "evaluate>=0.4.2",
    "rouge-score>=0.1.2",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.1",
    "gradio>=4.44.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
